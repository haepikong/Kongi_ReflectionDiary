<body>

  <script>
    const seed = {
      students: [
        {id:'s1',studentNo:'01',name:'김하늘',grade:'2학년 · 3반',initials:'하늘',tint:'#e7edda',lesson:'분수의 덧셈',focus:'분모가 다른 분수',notes:'분모가 다른 분수의 통분 과정을 스스로 설명함. 처음에는 공통분모를 찾는 데 시간이 걸렸지만, 그림으로 바꾸어 생각한 뒤 풀이에 자신감을 보임. 마지막 문제에서는 친구에게 풀이 방법을 설명해 줌.',feedback:'오늘은 통분이 낯설어도 그림으로 바꾸어 생각하며 끝까지 해결해 냈어요. 풀이를 친구에게 설명한 모습에서 개념을 자기 것으로 만들고 있다는 게 느껴졌습니다. 다음 시간에는 공통분모를 조금 더 빠르게 찾는 연습을 함께 해봐요.',feedbackAt:'오늘 오후 2:18',ack:false,reflection:'처음에는 분모가 달라서 어떻게 해야 할지 헷갈렸다. 그림을 그려 보니까 같은 크기로 나누는 게 보여서 문제를 풀 수 있었다. 친구에게 설명할 때 내가 알고 있는 걸 다시 확인할 수 있어서 좋았다.',mood:'뿌듯해요',reflectionAt:'오늘 오후 1:42',teacherRead:false},
        {id:'s2',studentNo:'02',name:'박도윤',grade:'2학년 · 3반',initials:'도윤',tint:'#e0ebef',lesson:'분수의 덧셈',focus:'공통분모 찾기',notes:'공통분모를 찾는 문제에서 여러 방법을 시도함. 짝 활동에서 의견을 나눈 뒤 계산 실수가 줄어들었고, 마지막 형성평가에서 정확하게 풀이함.',feedback:'여러 방법을 직접 시도해 본 점이 좋았어요. 짝과 생각을 나누면서 계산 실수도 스스로 발견했네요. 다음 시간에는 오늘 사용한 방법 중 가장 편한 방법을 골라 설명해 봅시다.',feedbackAt:'오늘 오후 2:04',ack:true,reflection:'짝이랑 같이 풀면서 내가 놓친 부분을 발견했다. 다음에는 혼자서도 실수 없이 풀어보고 싶다.',mood:'궁금해요',reflectionAt:'오늘 오후 1:51',teacherRead:true},
        {id:'s3',studentNo:'03',name:'이서윤',grade:'2학년 · 3반',initials:'서윤',tint:'#f2e7df',lesson:'분수의 덧셈',focus:'그림으로 나타내기',notes:'분수 막대 그림을 활용해 문제를 시각적으로 표현함. 풀이를 발표할 때 또렷하게 설명했고, 친구의 질문에도 차분히 답함.',feedback:'분수 막대를 활용해 생각을 눈에 보이게 표현한 점이 인상적이었어요. 친구의 질문에도 차분하게 답해 주어 함께 배우는 분위기를 만들어 주었습니다.',feedbackAt:'오늘 오후 1:58',ack:false,reflection:'그림을 먼저 그리면 계산이 쉬워진다는 걸 알았다. 발표할 때 조금 떨렸지만 끝까지 설명해서 뿌듯하다.',mood:'뿌듯해요',reflectionAt:'오늘 오후 1:47',teacherRead:false},
        {id:'s4',studentNo:'04',name:'정민재',grade:'2학년 · 3반',initials:'민재',tint:'#ece5f2',lesson:'분수의 덧셈',focus:'풀이 과정 점검',notes:'계산 결과는 맞았으나 풀이 과정에 일부 생략이 있었음. 교사의 질문을 듣고 풀이 단계를 다시 써 보며 자신의 생각을 정리함.',feedback:'답을 맞히는 것뿐 아니라 풀이 과정을 다시 살펴본 태도가 좋았어요. 오늘처럼 중간 과정을 한 줄씩 적어두면 나중에 생각을 다시 따라가기도 쉬워요.',feedbackAt:'오늘 오후 1:46',ack:true,reflection:'과정을 쓰는 게 귀찮았는데 다시 보니까 어디서 생각했는지 알 수 있었다. 다음에는 처음부터 조금씩 적어야겠다.',mood:'차분해요',reflectionAt:'오늘 오후 1:39',teacherRead:false}
      ]
    };
    const defaultClassrooms=[{code:'HAPPY24',name:'2학년 3반'},{code:'HAPPY25',name:'2학년 4반'}];
    const extraClassStudents=[
      {id:'s5',studentNo:'01',classCode:'HAPPY25',className:'2학년 4반',name:'윤서아',grade:'2학년 · 4반',initials:'서아',tint:'#e8e4d4',lesson:'식물의 한살이',focus:'식물의 성장',notes:'관찰한 내용을 그림과 말로 정리함.',feedback:'식물이 자라는 모습을 꼼꼼히 관찰했어요.',feedbackAt:'오늘 오후 2:10',ack:true,reflection:'잎이 자라는 모습을 관찰하니 식물이 살아 있다는 게 실감 났다.',mood:'궁금해요',reflectionAt:'오늘 오후 1:35',teacherRead:true,stickerAwards:[{date:'2026-10-18'},{date:'2026-10-17'}]},
      {id:'s6',studentNo:'02',classCode:'HAPPY25',className:'2학년 4반',name:'이준호',grade:'2학년 · 4반',initials:'준호',tint:'#e0e9e5',lesson:'식물의 한살이',focus:'식물의 성장',notes:'짝과 관찰 결과를 비교함.',feedback:'친구와 관찰한 점을 나누며 생각을 넓혔어요.',feedbackAt:'오늘 오후 1:56',ack:true,reflection:'친구와 관찰한 것을 비교하니까 서로 다른 점도 찾을 수 있었다.',mood:'뿌듯해요',reflectionAt:'오늘 오후 1:28',teacherRead:true,stickerAwards:[{date:'2026-10-18'}]}
    ];
    let state;
    try { state = JSON.parse(localStorage.getItem('learning-reflection-v1')) || structuredClone(seed); } catch { state = structuredClone(seed); }
    if (!Array.isArray(state.classrooms)) state.classrooms=structuredClone(defaultClassrooms);
    defaultClassrooms.forEach(room=>{if(!state.classrooms.some(item=>item.code===room.code))state.classrooms.push({...room})});
    const classrooms=state.classrooms;
    extraClassStudents.forEach(student=>{if(!state.students.some(item=>item.id===student.id))state.students.push(structuredClone(student))});
    if (!Array.isArray(state.subjects)) state.subjects = ['정보','국어','과학','사회','수학'];
    state.subjects=['정보',...state.subjects.filter(subject=>subject!=='정보')];
    if (!state.defaultSubject || !state.subjects.includes(state.defaultSubject)) state.defaultSubject='정보';
    if (!state.teacherProfile || typeof state.teacherProfile !== 'object') state.teacherProfile={name:'김선생님',nickname:'김쌤'};
    if (!state.teacherProfile.name) state.teacherProfile.name='김선생님';
    if (!state.teacherProfile.nickname) state.teacherProfile.nickname='김쌤';
    if (typeof state.teacherAccessCode !== 'string') state.teacherAccessCode='2468';
    if (!Array.isArray(state.lessonRecords)) state.lessonRecords=[];
    const dateKey = (date = new Date()) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    state.students.forEach(student => {
      if (!student.classCode) student.classCode='HAPPY24';
      if (!student.className) student.className=classrooms.find(room=>room.code===student.classCode)?.name||'2학년 3반';
      if (!Array.isArray(student.reflectionHistory)) student.reflectionHistory = student.reflection ? [{date:dateKey(),text:student.reflection,subject:'수학',mood:student.mood||'',time:student.reflectionAt||'오늘',teacherRead:!!student.teacherRead}] : [];
      if (!Array.isArray(student.stickerAwards)) student.stickerAwards = [];
    });
    let role = 'student';
    let session = null;
    try { session = JSON.parse(localStorage.getItem('learning-reflection-session')) || null; } catch { session = null; }

    function lessonRecordingCard(){const supportsSpeech=!!(window.SpeechRecognition||window.webkitSpeechRecognition);return `<section class="card card-pad lesson-recorder"><div class="card-head"><div><div class="card-title">수업 녹음과 돌아보기</div><div class="card-sub">녹음하고 받아쓴 내용을 다음 수업 준비에 활용해요.</div></div><span class="badge ${mediaRecorder?'pending':'blue'}">${mediaRecorder?'녹음 중':'수업 기록'}</span></div><div class="recorder-controls"><button type="button" class="${mediaRecorder?'record-stop':'record-start'}" data-tool="${mediaRecorder?'stop-recording':'start-recording'}">${mediaRecorder?'녹음 중지':'수업 녹음 시작'}</button><span class="record-timer" id="recordTimer">${String(Math.floor(recordingElapsed/60)).padStart(2,'0')}:${String(recordingElapsed%60).padStart(2,'0')}</span>${recordingAudioUrl?`<button type="button" class="secondary-btn audio-download" data-tool="download-audio">녹음 파일 받기</button>`:''}</div><p class="recording-status" id="recordingStatus">${esc(recordingNotice||(supportsSpeech?'녹음 중 한국어 받아쓰기를 시도해요. 마이크 권한을 허용해 주세요.':'이 브라우저는 자동 받아쓰기를 지원하지 않아요. 녹음 후 내용을 직접 입력할 수 있어요.'))}</p><label class="field-label" for="lessonTranscript">수업 내용 받아쓰기 / 전사문</label><textarea class="lesson-transcript" id="lessonTranscript" placeholder="녹음 중 인식된 내용이 여기에 적혀요. 자동 받아쓰기가 지원되지 않으면 직접 수업 내용을 입력해 주세요.">${esc(transcriptDraft)}</textarea><div class="btn-row"><button class="soft-btn" type="button" data-tool="analyze-lesson">잘한 점과 보완점 정리</button>${lessonAnalysisDraft?`<button class="primary-btn" type="button" data-tool="save-lesson-record">수업 기록 저장</button>`:''}</div>${lessonAnalysisDraft?`<div class="lesson-analysis-result"><div><strong>잘한 점</strong><ul>${lessonAnalysisDraft.strengths.map(item=>`<li>${esc(item)}</li>`).join('')}</ul></div><div><strong>보완하면 좋을 점</strong><ul>${lessonAnalysisDraft.improvements.map(item=>`<li>${esc(item)}</li>`).join('')}</ul></div><div><strong>다음 수업 참고</strong><p>${esc(lessonAnalysisDraft.nextSteps)}</p></div><small>전사문 키워드로 만든 체험용 분석 초안입니다. 실제 수업 상황에 맞게 검토해 주세요.<     function lessonRecordsList(){const records=state.lessonRecords.filter(record=>selectedClass==='all'||record.classCode===selectedClass).slice(0,6);return `${lessonGrowthDashboard()}<section class="card card-pad lesson-history"><div class="card-head"><div><div class="card-title">저장한 수업 성찰</div><div class="card-sub">전사문과 분석 보고서를 다시 볼 수 있어요.</div></div><span class="badge blue">${records.length}개</span></div>${records.length?records.map(record=>`<details class="lesson-record"><summary><span>${esc(record.date)} · ${esc(record.className)}</span><span>${esc(record.duration||'')}</span></summary><p class="record-transcript">${esc(record.transcript)}</p><strong>잘한 점</strong><ul>${(record.strengths||[]).map(item=>`<li>${esc(item)}</li>`).join('')}</ul><strong>보완할 점</strong><ul>${(record.improvements||[]).map(item=>`<li>${esc(item)}</li>`).join('')}</ul><strong>다음 수업</strong><p>${esc(record.nextSteps)}</p><div class="lesson-export-tools"><button type="button" data-report-tool="pdf" data-record-id="${esc(record.id)}">PDF로 저장</button><button type="button" data-report-tool="doc" data-record-id="${esc(record.id)}">문서 파일 받기</button>${record.hasAudio?`<button type="button" data-report-tool="audio" data-record-id="${esc(record.id)}">녹음 파일 다운로드</button>`:''}</div></details>`).join(''):`<div class="empty">아직 저장한 수업 성찰이 없어요.</div>`}</section>`}
    function startLessonRecording(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){recordingNotice='이 브라우저에서는 녹음을 지원하지 않아요. 전사문을 직접 입력할 수 있어요.';render();return}navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{mediaStream=stream;recordingChunks=[];transcriptBase=transcriptDraft.trim();transcriptFinal='';transcriptInterim='';if(recordingAudioUrl){URL.revokeObjectURL(recordingAudioUrl);recordingAudioUrl=''}const mimeType=MediaRecorder.isTypeSupported?.('audio/webm;codecs=opus')?'audio/webm;codecs=opus':undefined;mediaRecorder=mimeType?new MediaRecorder(stream,{mimeType}):new MediaRecorder(stream);mediaRecorder.ondataavailable=event=>{if(event.data.size)recordingChunks.push(event.data)};mediaRecorder.onstop=()=>{recordingAudioType=mediaRecorder?.mimeType||'audio/webm';const blob=new Blob(recordingChunks,{type:recordingAudioType});recordingAudioUrl=URL.createObjectURL(blob);mediaStream?.getTracks().forEach(track=>track.stop());mediaStream=null;mediaRecorder=null;recordingStarted=0;clearInterval(recordingTimer);recordingTimer=null;recordingNotice=transcriptDraft.trim()?'녹음이 끝났어요. 받아쓴 내용을 확인하고 필요한 부분을 고쳐 주세요.':'녹음이 끝났어요. 자동 받아쓰기가 안 됐다면 아래에 내용을 직접 적어 주세요.';render();toast('수업 녹음이 끝났어요.')};mediaRecorder.start();recordingStarted=Date.now();recordingElapsed=0;recordingNotice='녹음 중입니다. 수업 내용을 또렷하게 말씀해 주세요.';recordingTimer=setInterval(()=>{recordingElapsed=Math.floor((Date.now()-recordingStarted)/1000);const timer=app.querySelector('#recordTimer');if(timer)timer.textContent=`${String(Math.floor(recordingElapsed/60)).padStart(2,'0')}:${String(recordingElapsed%60).padStart(2,'0')}`},1000);const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(SpeechRecognition){try{speechRecognition=new SpeechRecognition();speechRecognition.lang='ko-KR';speechRecognition.continuous=true;speechRecognition.interimResults=true;speechRecognition.onresult=event=>{transcriptInterim='';for(let index=event.resultIndex;index<event.results.length;index++){const phrase=event.results[index][0].transcript;if(event.results[index].isFinal)transcriptFinal+=`${phrase} `;else transcriptInterim=phrase}transcriptDraft=[transcriptBase,transcriptFinal,transcriptInterim].filter(Boolean).join(' ').trim();const input=app.querySelector('#lessonTranscript');if(input)input.value=transcriptDraft};speechRecognition.onerror=()=>{recordingNotice='녹음은 계속되지만 자동 받아쓰기에 문제가 있어요. 끝난 뒤 전사문을 직접 보완해 주세요.';const status=app.querySelector('#recordingStatus');if(status)status.textContent=recordingNotice};speechRecognition.start()}catch{recordingNotice='녹음 중이에요. 자동 받아쓰기를 시작하지 못해 전사문을 직접 입력해 주세요.'}}else recordingNotice='녹음 중이에요. 자동 받아쓰기를 지원하지 않아 전사문을 직접 입력해 주세요.';render()}).catch(()=>{mediaStream?.getTracks().forEach(track=>track.stop());mediaStream=null;mediaRecorder=null;recordingNotice='마이크를 사용할 수 없어요. 브라우저의 마이크 권한을 허용한 뒤 다시 시도해 주세요.';render();toast('마이크 권한을 확인해 주세요.')})}
    function stopLessonRecording(){if(mediaRecorder?.state!=='recording')return;recordingElapsed=Math.floor((Date.now()-recordingStarted)/1000);const recorder=mediaRecorder,stopRecorder=()=>{if(recorder.state==='recording')recorder.stop()};recorder.addEventListener('stop',()=>{recordingAudioBlob=new Blob(recordingChunks,{type:recorder.mimeType||'audio/webm'});const typed=(app.querySelector('#lessonTranscript')?.value||transcriptDraft).trim(),recognized=[transcriptBase,transcriptFinal.trim(),transcriptInterim.trim()].filter(Boolean).join(' ').trim();transcriptDraft=recognized||typed;if(transcriptDraft){lessonAnalysisDraft=analyzeLessonTranscript(transcriptDraft);recordingNotice='녹음이 끝났어요. 받아쓰기와 분석 초안을 확인하고, 바로 PDF나 문서로 저장할 수 있어요.'}else{lessonAnalysisDraft=null;recordingNotice='녹음이 끝났어요. 자동 받아쓰기가 되지 않았습니다. 전사문을 직접 입력해 분석해 주세요.'}render()},{once:true});if(speechRecognition){const recognition=speechRecognition;speechRecognition=null;const fallback=setTimeout(stopRecorder,1500);recognition.onend=()=>{clearTimeout(fallback);stopRecorder()};try{recognition.stop()}catch{clearTimeout(fallback);stopRecorder()}}else stopRecorder()}
    function downloadLessonAudio(){if(!recordingAudioUrl)return;const link=document.createElement('a'),extension=recordingAudioType.includes('ogg')?'ogg':recordingAudioType.includes('mp4')?'mp4':'webm';link.href=recordingAudioUrl;link.download=`수업녹음_${dateKey()}.${extension}`;document.body.appendChild(link);link.click();link.remove()}
    function openLessonAudioDb(){if(!window.indexedDB)return Promise.reject(new Error('IndexedDB unavailable'));if(!lessonAudioDbPromise)lessonAudioDbPromise=new Promise((resolve,reject)=>{const request=indexedDB.open('learning-reflection-audio',1);request.onupgradeneeded=()=>request.result.createObjectStore('recordings');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});return lessonAudioDbPromise}
    function storeLessonAudio(id,blob){return openLessonAudioDb().then(db=>new Promise((resolve,reject)=>{const transaction=db.transaction('recordings','readwrite');transaction.objectStore('recordings').put(blob,id);transaction.oncomplete=()=>resolve();transaction.onerror=()=>reject(transaction.error)}))}
    function readLessonAudio(id){return openLessonAudioDb().then(db=>new Promise((resolve,reject)=>{const request=db.transaction('recordings','readonly').objectStore('recordings').get(id);request.onsuccess=()=>resolve(request.result||null);request.onerror=()=>reject(request.error)}))}
    function downloadSavedLessonAudio(id){const record=state.lessonRecords.find(item=>item.id===id);readLessonAudio(id).then(blob=>{if(!blob){toast('녹음 파일을 이 기기에서 찾지 못했어요.');return}const url=URL.createObjectURL(blob),extension=blob.type.includes('ogg')?'ogg':blob.type.includes('mp4')?'mp4':'webm',link=document.createElement('a');link.href=url;link.download=`수업녹음_${record?.date||dateKey()}.${extension}`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}).catch(()=>toast('녹음 파일을 불러오지 못했어요.'))}
    function lessonReportHtml(record){const list=items=>items?.length?`<ul>${items.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>`:'<p>기록된 항목이 없어요.</p>';return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>수업 성찰 보고서</title><style>@page{size:A4;margin:20mm}body{font-family:Arial,sans-serif;color:#26352b;line-height:1.7}h1{font-size:24px;border-bottom:2px solid #64866c;padding-bottom:12px}h2{font-size:16px;color:#41644a;margin:24px 0 6px}.meta{color:#68786b;font-size:12px}.transcript{white-space:pre-wrap;border:1px solid #dfe6dd;background:#f7f9f6;padding:14px;border-radius:8px}.next{background:#eef4e8;padding:14px;border-radius:8px}</style></head><body><h1>교사 수업 성찰 보고서</h1><p class="meta">날짜: ${esc(record.date)} · 학급: ${esc(record.className)} · 담당: ${esc(state.teacherProfile.name)}</p><h2>수업 내용 전사문</h2><div class="transcript">${esc(record.transcript)}</div><h2>잘한 점</h2>${list(record.strengths)}<h2>보완하면 좋을 점</h2>${list(record.improvements)}<h2>다음 수업 참고</h2><div class="next">${esc(record.nextSteps)}</div><p class="meta">키워드 기반 분석 초안입니다. 실제 수업 상황을 반영해 검토해 주세요.</p></body></html>`}
    function deliverLessonReport(record,format){const html=lessonReportHtml(record);if(format==='doc'){const blob=new Blob(['\uFEFF',html],{type:'application/msword;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`수업성찰_${record.date}.doc`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);return}const printWindow=window.open('','_blank');if(!printWindow){toast('팝업을 허용한 뒤 PDF 저장을 다시 눌러 주세요.');return}printWindow.onload=()=>setTimeout(()=>{printWindow.focus();printWindow.print()},250);printWindow.document.open();printWindow.document.write(html);printWindow.document.close()}
    function exportLessonReport(id,format){const record=state.lessonRecords.find(item=>item.id===id);if(record)deliverLessonReport(record,format)}
    function exportDraftLessonReport(format){const transcript=(app.querySelector('#lessonTranscript')?.value||transcriptDraft).trim();if(!transcript){toast('전사문을 먼저 작성해 주세요.');return}if(!lessonAnalysisDraft)lessonAnalysisDraft=analyzeLessonTranscript(transcript);const classCode=selectedClass==='all'?current().classCode:selectedClass;deliverLessonReport({date:dateKey(),classCode,className:classroomName(classCode),transcript,strengths:lessonAnalysisDraft.strengths,improvements:lessonAnalysisDraft.improvements,nextSteps:lessonAnalysisDraft.nextSteps},format)}
    function lessonGrowthDashboard(){const records=state.lessonRecords.filter(record=>selectedClass==='all'||record.classCode===selectedClass).slice(0,8).reverse(),strengths=records.flatMap(record=>record.strengths||[]),improvements=records.flatMap(record=>record.improvements||[]),mostCommon=items=>{const counts=new Map();items.forEach(item=>counts.set(item,(counts.get(item)||0)+1));return [...counts].sort((a,b)=>b[1]-a[1])[0]?.[0]||'기록이 쌓이면 성장 흐름을 보여드려요.'},max=Math.max(1,...records.flatMap(record=>[(record.strengths||[]).length,(record.improvements||[]).length]));return `<section class="card card-pad lesson-growth-dashboard" data-management="lessons"><div class="card-head"><div><div class="card-title">나의 수업 성장 흐름</div><div class="card-sub">최근 수업 성찰에서 잘한 점과 성장 목표를 모았어요.</div></div><span class="badge blue">최근 ${records.length}회</span></div><div class="growth-summary"><div><strong>${records.length}</strong><span>수업 기록</span></div><div><strong>${strengths.length}</strong><span>잘한 점</span></div><div><strong>${improvements.length}</strong><span>성장 목표</span></div></div>${records.length?`<div class="growth-chart" role="img" aria-label="최근 수업별 잘한 점과 성장 목표 수 비교">${records.map(record=>{const good=record.strengths?.length||0,work=record.improvements?.length||0;return `<div class="growth-column"><div class="growth-bars"><i class="growth-good" style="height:${Math.max(good?8:0,good/max*100)}%" title="잘한 점 ${good}개"></i><i class="growth-work" style="height:${Math.max(work?8:0,work/max*100)}%" title="성장 목표 ${work}개"></i></div><small>${esc(record.date.slice(5))}</small></div>`}).join('')}</div><div class="growth-legend"><span><i class="growth-good-key"></i>잘한 점</span><span><i class="growth-work-key"></i>성장 목표</span></div><div class="growth-insights"><p><strong>자주 보인 강점</strong>${esc(mostCommon(strengths))}</p><p><strong>이어갈 성장 목표</strong>${esc(mostCommon(improvements))}</p></div>`:`<div class="empty">수업 성찰을 저장하면 수업 성장 차트가 만들어져요.</div>`}</section>`}
    function mountDraftReportActions(){const result=app.querySelector('.lesson-analysis-result');if(!result||result.querySelector('.draft-export-tools'))return;result.insertAdjacentHTML('beforeend','<div class="lesson-export-tools draft-export-tools"><button type="button" data-report-tool="draft-pdf">PDF로 저장</button><button type="button" data-report-tool="draft-doc">Google 문서용 다운로드</button></div>')}
    function saveLessonRecord(){const transcript=(app.querySelector('#lessonTranscript')?.value||transcriptDraft).trim();if(!transcript){toast('먼저 녹음하거나 전사 내용을 입력해 주세요.');return}if(!lessonAnalysisDraft)lessonAnalysisDraft=analyzeLessonTranscript(transcript);const classCode=selectedClass==='all'?current().classCode:selectedClass,audio=recordingAudioBlob,record={id:`lesson-${Date.now()}`,date:dateKey(),time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),classCode,className:classroomName(classCode),duration:recordingElapsed?`${Math.floor(recordingElapsed/60)}분 ${recordingElapsed%60}초`:'',transcript,strengths:lessonAnalysisDraft.strengths,improvements:lessonAnalysisDraft.improvements,nextSteps:lessonAnalysisDraft.nextSteps,hasAudio:!!audio};state.lessonRecords.unshift(record);save();if(audio)storeLessonAudio(record.id,audio).catch(()=>toast('전사문은 저장됐지만 녹음 파일 저장에 실패했어요.'));lessonAnalysisDraft=null;transcriptDraft='';transcriptBase='';transcriptFinal='';transcriptInterim='';render();toast('수업 전사문과 분석을 저장했어요.')}
    app.addEventListener('click',event=>{const button=event.target.closest('[data-tool]');if(!button)return;const tool=button.dataset.tool;if(tool==='download-csv')downloadReflectionsCsv();if(tool==='start-recording')startLessonRecording();if(tool==='stop-recording')stopLessonRecording();if(tool==='download-audio')downloadLessonAudio();if(tool==='analyze-lesson'){const transcript=(app.querySelector('#lessonTranscript')?.value||transcriptDraft).trim();if(!transcript){toast('먼저 녹음하거나 전사 내용을 입력해 주세요.');return}transcriptDraft=transcript;lessonAnalysisDraft=analyzeLessonTranscript(transcript);render()}if(tool==='save-lesson-record')saveLessonRecord()});
    async function resetStudentPassword(studentId){const student=state.students.find(item=>item.id===studentId);if(!student)return;const temporaryCode=`Study${Math.floor(1000+Math.random()*9000)}Go`;try{student.passwordSalt=createStudentSalt();student.passwordHash=await hashStudentPassword(temporaryCode,student.passwordSalt);student.mustChangePassword=true;resetCodes[student.id]=temporaryCode;save();render();toast(`${student.name} 학생의 임시 코드를 만들었어요.`)}catch{toast('비밀번호 초기화에 실패했어요. 안전한 HTTPS 연결을 확인해 주세요.')}}
    function studentPasswordManagementPage(){const students=studentsForClass();return `<section class="card card-pad student-password-management" data-management="passwords"><div class="card-head"><div><div class="card-title">학생 비밀번호 관리</div><div class="card-sub">학급 코드를 기준으로 학생 비밀번호를 확인하고 초기화할 수 있어요.</div></div><span class="badge blue">${students.length}명</span></div>${students.length?`<div class="student-password-list">${students.map(student=>{const status=student.mustChangePassword?'새 비밀번호 설정 대기':student.passwordHash?'비밀번호 설정 완료':'최초 비밀번호 설정 대기',temp=resetCodes[student.id];return `<article class="student-password-row"><span class="avatar" style="background:${student.tint}">${esc(student.initials)}</span><span class="student-password-identity"><strong>${esc(student.name)}</strong><small>${esc(student.className)} · 학번 ${esc(student.studentNo)}</small><span>${status}</span></span><button type="button" class="soft-btn" data-reset-student-password="${esc(student.id)}">비밀번호 초기화</button>${temp?`<div class="temporary-password"><span>학생에게 전달할 임시 코드</span><code>${esc(temp)}</code><button type="button" data-copy-reset-code="${esc(student.id)}">복사</button><small>학생은 이 코드로 로그인한 뒤 새 비밀번호를 설정해야 해요.</small></div>`:''}</article>`}).join('')}</div>`:`<div class="empty">선택한 학급에 등록된 학생이 없어요.</div>`}<p class="password-admin-note">임시 비밀번호는 초기화 직후에만 표시됩니다. 학생에게 안전하게 전달해 주세요.</p></section>`}

    function bind(){const profileClass=app.querySelector('.profile small');if(profileClass)profileClass.textContent=role==='student'?current().className:`담임 교사 · ${selectedClass==='all'?'전체 학급':classroomName(selectedClass)}`;const setId=(selector,id)=>{const element=app.querySelector(selector);if(element)element.id=id};setId('.welcome','dashboard-top');setId('.feedback-card','feedback');setId('#reflection','reflection');const reflectionInput=app.querySelector('#reflection');if(reflectionInput)reflectionInput.closest('.card').id='reflection-editor';const historyCard=[...app.querySelectorAll('.card')].find(card=>card.querySelector('.card-title')?.textContent.trim()==='나의 성찰 기록');if(historyCard)historyCard.id='reflection-history';setId('.teacher-panel','lesson-observation');const teacherJournal=app.querySelector('.sticker-give')?.closest('.card');if(teacherJournal)teacherJournal.id='teacher-journal';const subjectCards=app.querySelectorAll('.subject-manager');if(subjectCards[0])subjectCards[0].id='subjects';if(subjectCards[1])subjectCards[1].id='classrooms';setId('.rank-card','growth-rankings');const nav=app.querySelector('.nav-list');if(role==='teacher'&&nav){const classNav=document.createElement('button');classNav.type='button';classNav.className='nav-item';classNav.innerHTML=`${icon('note')} 학급 코드 관리`;nav.append(classNav)}const navTargets=role==='student'?['dashboard-top','feedback','reflection-history']:['dashboard-top','teacher-journal','growth-rankings','classrooms'];app.querySelectorAll('.nav-item').forEach((item,index)=>item.addEventListener('click',()=>document.getElementById(navTargets[index])?.scrollIntoView({behavior:'smooth',block:'start'})));const generateCode=document.getElementById('generateClassroomCode');if(generateCode)generateCode.addEventListener('click',()=>{let code;do{code=`HAPPY${Math.floor(1000+Math.random()*9000)}`}while(classrooms.some(room=>room.code===code));document.getElementById('classroomCode').value=code;document.getElementById('classroomName').focus()});app.querySelector('[data-logout]')?.addEventListener('click',()=>{session=null;localStorage.removeItem('learning-reflection-session');monitoringDraft='';feedbackDraft='';analysisText='';reflectionDraft='';render()});app.querySelectorAll('[data-student]').forEach(el=>el.addEventListener('click',()=>{selectedId=el.dataset.student;monitoringDraft='';feedbackDraft='';analysisText='';reflectionDraft='';selectedMood=current().mood||'뿌듯해요';render()}));const reflection=document.getElementById('reflection');if(reflection)reflection.addEventListener('input',e=>reflectionDraft=e.target.value);const subjectSelect=document.getElementById('subjectSelect');if(subjectSelect)subjectSelect.addEventListener('change',e=>{selectedSubject=e.target.value;reflectionDraft=current().reflectionHistory.find(entry=>entry.date===dateKey()&&entry.subject===selectedSubject)?.text||'';if(reflection)reflection.value=reflectionDraft});const subjectForm=document.getElementById('subjectForm');if(subjectForm)subjectForm.addEventListener('submit',event=>{event.preventDefault();const name=String(new FormData(subjectForm).get('subjectName')||'').trim(),error=document.getElementById('subjectError');if(state.subjects.some(subject=>subject.toLocaleLowerCase('ko')===name.toLocaleLowerCase('ko'))){error.textContent='이미 등록된 과목이에요.';return}state.subjects.push(name);save();render();toast(`${name} 과목을 등록했어요.`)});const monitoring=document.getElementById('monitoring');if(monitoring)monitoring.addEventListener('input',e=>monitoringDraft=e.target.value);const feedback=document.getElementById('feedbackDraft');if(feedback)feedback.addEventListener('input',e=>feedbackDraft=e.target.value);app.querySelectorAll('[data-mood]').forEach(el=>el.addEventListener('click',()=>{selectedMood=el.dataset.mood;render()}));app.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>action(el.dataset.action)))}
    function action(type){const s=current();if(type==='ack-feedback'){s.ack=true;save();render();toast('피드백 확인 사실을 선생님께 전했어요.')}if(type==='save-reflection'){if(!reflectionDraft.trim()){toast('오늘의 생각을 한 줄 적어주세요.');return}const today=dateKey(),text=reflectionDraft.trim(),subject=document.getElementById('subjectSelect')?.value||selectedSubject;let entry=s.reflectionHistory.find(item=>item.date===today&&item.subject===subject);if(entry){entry.text=text;entry.mood=selectedMood;entry.time='오늘 방금';entry.teacherRead=false}else{s.reflectionHistory.push({date:today,text,subject,mood:selectedMood,time:'오늘 방금',teacherRead:false})}s.reflection=text;s.mood=selectedMood;s.reflectionAt='오늘 방금';s.teacherRead=false;selectedSubject=subject;reflectionDraft='';save();render();toast('성찰 일기를 과목별 기록에 저장했어요.')}if(type==='analyze'){const notes=(document.getElementById('monitoring')?.value||'').trim();if(!notes){toast('수업 관찰 내용을 먼저 적어주세요.');return}monitoringDraft=notes;const low=notes.toLowerCase();let strengths=[];if(/설명|발표|친구|짝|함께|질문/.test(low))strengths.push('생각을 말로 나누고 친구와 함께 배우려는 모습');if(/그림|시도|방법|스스로|다시|끝까지/.test(low))strengths.push('자신만의 방법으로 문제를 해결해 보려는 태도');if(/정확|성공|해결|완성|맞/.test(low))strengths.push('배운 내용을 실제 문제에 적용해 낸 성취');if(!strengths.length)strengths.push('수업에 참여하며 배움의 과정을 이어간 모습');const challenge=/어려|시간|헷갈|실수|도움|망설/.test(low)?'처음에 어려움을 느낀 부분도 차근차근 다시 살펴본 과정':'새로운 내용에 도전하며 보여준 꾸준한 참여';analysisText=`관찰 메모에서 ${strengths.join('과 ')}이(가) 보여요. ${challenge}을(를) 의미 있는 배움의 과정으로 격려해 주세요. 다음 시간에는 오늘의 경험을 이어갈 수 있도록 한 가지 작은 연습 목표를 함께 정해보면 좋겠습니다.`;feedbackDraft=`오늘 수업에서 ${strengths[0]}이(가) 참 좋았어요. ${challenge}도 잘 해냈습니다. 다음 시간에는 오늘의 배움을 이어서 한 가지 더 도전해 봐요.`;render();toast('관찰 내용을 바탕으로 초안을 만들었어요.')}if(type==='send-feedback'){const value=(document.getElementById('feedbackDraft')?.value||feedbackDraft||'').trim();if(!value){toast('학생에게 전할 피드백을 작성해주세요.');return}s.feedback=value;s.feedbackAt='오늘 방금';s.ack=false;s.notes=(document.getElementById('monitoring')?.value||monitoringDraft||s.notes).trim();feedbackDraft='';analysisText='';save();render();toast(`${s.name} 학생에게 피드백을 보냈어요.`)}if(type==='read-reflection'){if(!s.reflection){toast('아직 작성된 일기가 없어요.');return}s.teacherRead=true;const latest=s.reflectionHistory.at(-1);if(latest)latest.teacherRead=true;save();render();toast(`${s.name} 학생에게 일기를 확인했다고 알렸어요.`)}if(type==='award-sticker'){if(!s.reflection){toast('학생이 일기를 작성한 뒤 스티커를 발부할 수 있어요.');return}s.stickerAwards.push({date:dateKey(),at:Date.now()});save();render();toast(`${s.name} 학생에게 칭찬 스티커를 발부했어요.`)}}
    selectedMood=current().mood||'뿌듯해요';if(session?.role==='student')selectedId=session.studentId;render();
  </script>
